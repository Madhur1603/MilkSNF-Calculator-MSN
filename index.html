<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Milk Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- =========================
             NAVBAR
        ========================== -->
        <nav class="navbar">

            <button
                class="nav-btn active"
                id="milkCalcNav"
                onclick="showCalculator('milk')">
                Milk Calculator
            </button>

            <button
                class="nav-btn"
                id="snfCalcNav"
                onclick="showCalculator('snf')">
                Find SNF
            </button>

        </nav>


        <!-- =========================
             MILK CALCULATOR
        ========================== -->
        <div
            id="milkCalculator"
            class="calculator-section">

            <h2>Milk Value Calculator</h2>

            <!-- Quantity + Fat -->
            <div class="row">

                <div class="input-group">

                    <label for="milk">
                        Quantity:
                    </label>

                    <input
                        type="number"
                        id="milk"
                        class="ctnt_box"
                        placeholder="Milk Quantity (L)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'fat')">

                </div>


                <div class="input-group">

                    <label for="fat">
                        Fat:
                    </label>

                    <input
                        type="number"
                        id="fat"
                        class="ctnt_box"
                        placeholder="Fat (%)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'snf')">

                </div>

            </div>


            <!-- SNF + Rate -->
            <div class="row">

                <div class="input-group">

                    <label for="snf">
                        SNF:
                    </label>

                    <input
                        type="number"
                        id="snf"
                        class="ctnt_box"
                        placeholder="SNF (%)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'method')">

                </div>


                <div class="input-group">

                    <label for="rate">
                        Rate:
                    </label>

                    <input
                        type="number"
                        id="rate"
                        class="ctnt_box"
                        placeholder="Rate"
                        step="0.01">

                </div>

            </div>


            <!-- SNF Method -->
            <div class="row">

                <div class="input-group full-width">

                    <label for="method">
                        SNF Method:
                    </label>

                    <select
                        id="method"
                        onkeydown="moveCursor(event, 'calculate')">

                        <option value="60/40">
                            60/40
                        </option>

                        <option value="52/48">
                            52/48
                        </option>

                    </select>

                </div>

            </div>


            <!-- Buttons -->
            <div class="btn">

                <button
                    onclick="calc()"
                    id="calculate">

                    Calculate

                </button>


                <button
                    onclick="refresh()"
                    id="refreshBtn"
                    onkeydown="handleRefreshKey(event)">

                    Refresh

                </button>

            </div>


            <!-- Milk Results -->
            <div
                class="result"
                id="milkResult"
                style="display: none;">

                <div class="result-row">

                    <span>
                        SNF per Kg Rate:
                    </span>

                    <span id="snfPerKgRate">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Fat per Kg Rate:
                    </span>

                    <span id="fatPerKgRate">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Value of Powder:
                    </span>

                    <span id="powderValue">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Value of Fat:
                    </span>

                    <span id="fatValue">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <strong>
                        Total Value:
                    </strong>

                    <strong id="totalValue">
                        --
                    </strong>

                </div>


                <div class="result-row">

                    <strong>
                        Average Rate:
                    </strong>

                    <strong id="avgRate">
                        --
                    </strong>

                </div>

            </div>

        </div>


        <!-- =========================
             FIND SNF CALCULATOR
        ========================== -->
        <div
            id="snfCalculator"
            class="calculator-section"
            style="display: none;">

            <h2>
                Find SNF Using CLR
            </h2>


            <!-- Fat -->
            <div class="row">

                <div class="input-group full-width">

                    <label for="clrFat">
                        Fat:
                    </label>

                    <input
                        type="number"
                        id="clrFat"
                        class="ctnt_box"
                        placeholder="Fat (%)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'clr')">

                </div>

            </div>


            <!-- CLR -->
            <div class="row">

                <div class="input-group full-width">

                    <label for="clr">
                        CLR:
                    </label>

                    <input
                        type="number"
                        id="clr"
                        class="ctnt_box"
                        placeholder="CLR"
                        step="0.01"
                        onkeydown="moveCursor(event, 'findSnfBtn')">

                </div>

            </div>


            <!-- Buttons -->
            <div class="btn">

                <button
                    onclick="findSNF()"
                    id="findSnfBtn">

                    Find SNF

                </button>


                <button
                    onclick="refreshSNF()"
                    id="refreshSnfBtn"
                    onkeydown="handleSNFRefreshKey(event)">

                    Refresh

                </button>

            </div>


            <!-- SNF Results -->
            <div
                class="result"
                id="snfResult"
                style="display: none;">

                <div class="result-row">

                    <span>
                        Fat × 0.2:
                    </span>

                    <span id="fatComponent">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        CLR ÷ 4:
                    </span>

                    <span id="clrComponent">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Constant:
                    </span>

                    <span>
                        0.14
                    </span>

                </div>


                <div class="result-row">

                    <strong>
                        Calculated SNF:
                    </strong>

                    <strong id="calculatedSnf">
                        --
                    </strong>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js" defer></script>

</body>

</html>
