<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Milk Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- =========================
             NAVBAR
        ========================== -->

        <nav class="navbar">

            <button
                class="nav-btn active"
                id="doodhiyaNav"
                onclick="showCalculator('doodhiya')">
                Doodhiya
            </button>

            <button
                class="nav-btn"
                id="thekedaarNav"
                onclick="showCalculator('thekedaar')">
                Thekedaar
            </button>

        </nav>


        <!-- =========================
             DOODHIYA CALCULATOR
        ========================== -->

        <div
            id="doodhiyaCalculator"
            class="calculator-section">

            <h2>Doodhiya</h2>


            <!-- Quantity + Fat -->

            <div class="row">

                <div class="input-group">

                    <label for="milk">
                        Quantity:
                    </label>

                    <input
                        type="number"
                        id="milk"
                        class="ctnt_box"
                        placeholder="Milk Quantity (L)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'fat')">

                </div>


                <div class="input-group">

                    <label for="fat">
                        Fat:
                    </label>

                    <input
                        type="number"
                        id="fat"
                        class="ctnt_box"
                        placeholder="Fat (%)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'snf')">

                </div>

            </div>


            <!-- SNF + Rate -->

            <div class="row">

                <div class="input-group">

                    <label for="snf">
                        SNF:
                    </label>

                    <input
                        type="number"
                        id="snf"
                        class="ctnt_box"
                        placeholder="SNF (%)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'rate')">

                </div>


                <div class="input-group">

                    <label for="rate">
                        Rate:
                    </label>

                    <input
                        type="number"
                        id="rate"
                        class="ctnt_box"
                        placeholder="Rate"
                        step="0.01"
                        onkeydown="moveCursor(event, 'method')">

                </div>

            </div>


            <!-- Method -->

            <div class="row">

                <div class="input-group full-width">

                    <label for="method">
                        SNF Method:
                    </label>

                    <select
                        id="method"
                        onkeydown="moveCursor(event, 'calculate')">

                        <option value="60/40">
                            60/40
                        </option>

                        <option value="52/48">
                            52/48
                        </option>

                    </select>

                </div>

            </div>


            <!-- Buttons -->

            <div class="btn">

                <button
                    onclick="calcDoodhiya()"
                    id="calculate">

                    Calculate

                </button>


                <button
                    onclick="refreshDoodhiya()"
                    id="refreshBtn"
                    onkeydown="handleDoodhiyaRefreshKey(event)">

                    Refresh

                </button>

            </div>


            <!-- Results -->

            <div
                class="result"
                id="doodhiyaResult"
                style="display: none;">

                <div class="result-row">

                    <span>
                        SNF per Kg Rate:
                    </span>

                    <span id="doodhiyaSnfPerKgRate">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Fat per Kg Rate:
                    </span>

                    <span id="doodhiyaFatPerKgRate">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Value of Powder:
                    </span>

                    <span id="doodhiyaPowderValue">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Value of Fat:
                    </span>

                    <span id="doodhiyaFatValue">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <strong>
                        Total Value:
                    </strong>

                    <strong id="doodhiyaTotalValue">
                        --
                    </strong>

                </div>


                <div class="result-row">

                    <strong>
                        Average Rate:
                    </strong>

                    <strong id="doodhiyaAvgRate">
                        --
                    </strong>

                </div>

            </div>

        </div>



        <!-- =========================
             THEKEDAAR CALCULATOR
        ========================== -->

        <div
            id="thekedaarCalculator"
            class="calculator-section"
            style="display: none;">

            <h2>Thekedaar</h2>


            <!-- Quantity + Fat -->

            <div class="row">

                <div class="input-group">

                    <label for="thekedaarMilk">
                        Quantity:
                    </label>

                    <input
                        type="number"
                        id="thekedaarMilk"
                        class="ctnt_box"
                        placeholder="Milk Quantity (L)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'thekedaarFat')">

                </div>


                <div class="input-group">

                    <label for="thekedaarFat">
                        Fat:
                    </label>

                    <input
                        type="number"
                        id="thekedaarFat"
                        class="ctnt_box"
                        placeholder="Fat (%)"
                        step="0.01"
                        onkeydown="moveCursor(event, 'thekedaarClr')">

                </div>

            </div>


            <!-- CLR + Rate -->

            <div class="row">

                <div class="input-group">

                    <label for="thekedaarClr">
                        CLR:
                    </label>

                    <input
                        type="number"
                        id="thekedaarClr"
                        class="ctnt_box"
                        placeholder="CLR"
                        step="0.01"
                        onkeydown="moveCursor(event, 'thekedaarRate')">

                </div>


                <div class="input-group">

                    <label for="thekedaarRate">
                        Rate:
                    </label>

                    <input
                        type="number"
                        id="thekedaarRate"
                        class="ctnt_box"
                        placeholder="Rate"
                        step="0.01"
                        onkeydown="moveCursor(event, 'thekedaarMethod')">

                </div>

            </div>


            <!-- Method -->

            <div class="row">

                <div class="input-group full-width">

                    <label for="thekedaarMethod">
                        SNF Method:
                    </label>

                    <select
                        id="thekedaarMethod"
                        onkeydown="moveCursor(event, 'thekedaarCalculate')">

                        <option value="60/40">
                            60/40
                        </option>

                        <option value="52/48">
                            52/48
                        </option>

                    </select>

                </div>

            </div>


            <!-- Buttons -->

            <div class="btn">

                <button
                    onclick="calcThekedaar()"
                    id="thekedaarCalculate">

                    Calculate

                </button>


                <button
                    onclick="refreshThekedaar()"
                    id="thekedaarRefreshBtn"
                    onkeydown="handleThekedaarRefreshKey(event)">

                    Refresh

                </button>

            </div>


            <!-- Results -->

            <div
                class="result"
                id="thekedaarResult"
                style="display: none;">


                <!-- Calculated SNF -->

                <div class="result-row">

                    <strong>
                        Calculated SNF:
                    </strong>

                    <strong id="thekedaarCalculatedSnf">
                        --
                    </strong>

                </div>


                <div class="result-row">

                    <span>
                        SNF per Kg Rate:
                    </span>

                    <span id="thekedaarSnfPerKgRate">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Fat per Kg Rate:
                    </span>

                    <span id="thekedaarFatPerKgRate">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Value of Powder:
                    </span>

                    <span id="thekedaarPowderValue">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <span>
                        Value of Fat:
                    </span>

                    <span id="thekedaarFatValue">
                        --
                    </span>

                </div>


                <div class="result-row">

                    <strong>
                        Total Value:
                    </strong>

                    <strong id="thekedaarTotalValue">
                        --
                    </strong>

                </div>


                <div class="result-row">

                    <strong>
                        Average Rate:
                    </strong>

                    <strong id="thekedaarAvgRate">
                        --
                    </strong>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js" defer></script>

</body>

</html>
